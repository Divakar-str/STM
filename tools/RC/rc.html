<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Print Card A4 Pro Studio</title>
  <link rel="stylesheet" href="style.css" />
  <!-- jsPDF for true vector mm-locked PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app-shell">
    
    <!-- Controls Sidebar -->
    <aside class="sidebar no-print">
      <header class="sidebar-header">
        <div class="logo">
          <span class="pill">PRO</span>
          <h1>Card Studio A4</h1>
        </div>
        <p class="tagline">Copies, Top/Center Align & Vector PDF</p>
      </header>

      <div class="sidebar-content">
        <!-- 1. Copy & Print Mode -->
        <div class="card-group highlight-group">
          <label class="group-title">Print & Copy Mode</label>
          <div class="field">
            <label for="printMode">Layout Selection</label>
            <select id="printMode">
              <option value="one-card-2-copies">1 Card (2 Copies of Front)</option>
              <option value="pair-2-copies">1 Pair (2 Fronts + 2 Backs)</option>
              <option value="single-pair">1 Pair (1 Front + 1 Back)</option>
              <option value="custom-copies">Custom Count</option>
              <option value="pairs-max">Fill Full Sheet (Max Pairs)</option>
              <option value="fronts-fill">Fronts Only (Fill Sheet)</option>
            </select>
          </div>

          <div class="grid-2" id="customCountWrapper" style="display: none;">
            <div class="field">
              <label for="copyCount">Copies Count</label>
              <input type="number" id="copyCount" value="2" min="1" max="20" />
            </div>
            <div class="field">
              <label for="copySource">Source Face</label>
              <select id="copySource">
                <option value="front">Front Image</option>
                <option value="back">Back Image</option>
                <option value="both">Both (Front + Back)</option>
              </select>
            </div>
          </div>

          <span class="hint-text" id="capacityHint">Mode: 2 exact copies of Front Card</span>
        </div>

        <!-- 2. Sheet Placement & Margins -->
        <div class="card-group">
          <label class="group-title">Sheet Alignment & Margins</label>
          <div class="grid-2">
            <div class="field">
              <label for="verticalAlign">Vertical Position</label>
              <select id="verticalAlign">
                <option value="top" selected>Top Margin</option>
                <option value="center">Page Center</option>
                <option value="bottom">Bottom Margin</option>
              </select>
            </div>
            <div class="field">
              <label for="horizontalAlign">Pairing Flow</label>
              <select id="horizontalAlign">
                <option value="row" selected>Row (Side by Side)</option>
                <option value="column">Column (Stacked)</option>
              </select>
            </div>
          </div>

          <div class="grid-3">
            <div class="field">
              <label for="topMargin">Top (mm)</label>
              <input type="number" id="topMargin" value="15" step="1" min="0" />
            </div>
            <div class="field">
              <label for="gapX">Gap X (mm)</label>
              <input type="number" id="gapX" value="5" step="0.5" min="0" />
            </div>
            <div class="field">
              <label for="gapY">Gap Y (mm)</label>
              <input type="number" id="gapY" value="6" step="0.5" min="0" />
            </div>
          </div>
        </div>

        <!-- 3. Dimensions & Standards -->
        <div class="card-group">
          <label class="group-title">Card Dimensions (mm)</label>
          <div class="field">
            <select id="presetSelect">
              <option value="85.6,53.98,3.18">CR80 (Standard ID / Credit Card)</option>
              <option value="88.9,50.8,0">US Business Card (3.5 × 2.0 in)</option>
              <option value="85,55,0">EU Business Card (85 × 55 mm)</option>
              <option value="custom">Custom Dimensions</option>
            </select>
          </div>
          <div class="grid-3">
            <div class="field">
              <label for="cardW">Width</label>
              <input type="number" id="cardW" value="85.6" step="0.1" min="10" />
            </div>
            <div class="field">
              <label for="cardH">Height</label>
              <input type="number" id="cardH" value="53.98" step="0.1" min="10" />
            </div>
            <div class="field">
              <label for="cardR">Radius</label>
              <input type="number" id="cardR" value="3.18" step="0.1" min="0" />
            </div>
          </div>
        </div>

        <!-- 4. Images & Card Actions -->
        <div class="card-group">
          <label class="group-title">Card Faces (Pan, Zoom, Rotate)</label>
          <div class="grid-2">
            <div class="upload-box" id="frontDrop">
              <span class="upload-label">Front Card</span>
              <input type="file" id="frontInput" accept="image/*" />
              <button type="button" class="btn-sm" id="rotateFrontBtn">↻ Rotate</button>
            </div>
            <div class="upload-box" id="backDrop">
              <span class="upload-label">Back Card</span>
              <input type="file" id="backInput" accept="image/*" />
              <button type="button" class="btn-sm" id="rotateBackBtn">↻ Rotate</button>
            </div>
          </div>
          <button type="button" class="btn-sm secondary-btn" id="copyFrontToBackBtn" style="width: 100%;">
            Duplicate Front Image to Back
          </button>
        </div>

        <!-- 5. Guides & Toggles -->
        <div class="card-group">
          <label class="group-title">Print Marks</label>
          <div class="toggles">
            <label class="toggle-row">
              <input type="checkbox" id="cropMarks" checked />
              <span>Print Crop Marks (Corner Lines)</span>
            </label>
            <label class="toggle-row">
              <input type="checkbox" id="centerFoldGuide" checked />
              <span>Center Folding / Cutting Line</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <footer class="sidebar-footer">
        <button id="exportPdfBtn" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Download PDF (300 DPI Scale)
        </button>
        <button id="printAction" class="btn btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Direct Print (Window)
        </button>
      </footer>
    </aside>

    <!-- Canvas Preview Stage -->
    <main class="stage">
      <div class="stage-bar no-print">
        <span id="sheetInfo">A4 Canvas Preview (210 × 297 mm)</span>
        <div class="zoom-controls">
          <button id="zoomOutBtn" class="btn-icon">−</button>
          <span id="zoomDisplay">65%</span>
          <button id="zoomInBtn" class="btn-icon">+</button>
        </div>
      </div>

      <div class="sheet-scroller">
        <div class="sheet-wrapper" id="sheetWrapper">
          <div class="a4-page" id="a4Page">
            <!-- Sheet content bounding box for alignment -->
            <div class="sheet-content-bounds" id="sheetBounds">
              <div class="grid-container" id="gridContainer"></div>
              <div class="fold-guide" id="foldGuide"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
