<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/x-icon" href="../images/png logo.png">
    <title>Print</title>
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Framework & Plugins -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="css/print.css">
</head>
<body class="studio-app">

    <!-- ================= Top Navigation Header ================= -->
    <header class="studio-header">
        <div class="header-left">
            <div class="logo-box">
                <i class="fa-solid fa-print"></i>
            </div>
            <div>
                <h5 class="brand-title mb-0">Print </h5>
            </div>
        </div>

        <div class="header-center">
            <div class="mode-switch-pill" role="tablist" aria-label="Editor Mode">
                <button id="tabFullBtn" class="pill-btn active" onclick="switchMode('full')">
                    <i class="fa-regular fa-file me-1"></i> Full Page A4
                </button>
                <button id="tabIdBtn" class="pill-btn" onclick="switchMode('id')">
                    <i class="fa-solid fa-id-card me-1"></i> ID Card
                </button>
            </div>
        </div>

        <div class="header-right">
            <!-- Full Page Actions -->
            <div id="fullHeaderActions" class="d-flex gap-2">
                <button class="btn btn-export" onclick="saveFull('image')">
                    <i class="fa-solid fa-download me-1"></i> Download
                </button>
                <button class="btn btn-print" onclick="printFullPage('image')">
                    <i class="fa-solid fa-print me-1"></i> Print 
                </button>
            </div>

            <!-- ID Actions -->
            <div id="idHeaderActions" class="d-none gap-2">
                <button class="btn btn-export" onclick="saveIDCopy('imageFront', 'imageBack')">
                    <i class="fa-solid fa-download me-1"></i> Download
                </button>
                <button class="btn btn-print" onclick="printIDCopy('imageFront', 'imageBack')">
                    <i class="fa-solid fa-print me-1"></i> Print 
                </button>
            </div>
        </div>
    </header>

    <!-- ================= Main Workspace Stage ================= -->
    <main class="studio-stage">
        <!-- ================= FULL PAGE MODE ================= -->
        <section id="fullPageSection" class="workspace-view">
            <div class="workspace-card">
                <!-- Floating Studio Ribbon Bar -->
                <div class="ribbon-bar">
                    <div class="ribbon-group">
                        <span class="group-label">Ratio:</span>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-ratio active" onclick="setRatio('image', NaN, this)">Free</button>
                            <button class="btn btn-ratio" onclick="setRatio('image', 85.6/53.98, this)">85:54 (ID)</button>
                            <button class="btn btn-ratio" onclick="setRatio('image', 1, this)">1:1</button>
                            <button class="btn btn-ratio" onclick="setRatio('image', 4/3, this)">4:3</button>
                        </div>
                    </div>

                    <div class="ribbon-divider"></div>

                    <div class="ribbon-group">
                        <button class="btn btn-crop" id="btnCrop-image" onclick="toggleCrop('image')">
                            <i class="fa-solid fa-crop-simple me-1"></i> Crop
                        </button>
                        <button class="btn btn-rotate" onclick="rotateImage('image')">
                            <i class="fa-solid fa-rotate-right me-1"></i> Rotate
                        </button>
                        <div class="dropdown">
                            <button class="btn btn-filter dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fa-solid fa-wand-magic-sparkles me-1"></i> Filter
                            </button>
                            <ul class="dropdown-menu shadow-sm">
                                <li><a class="dropdown-item" href="javascript:applyFilter('image', 'none')">Original Color</a></li>
                                <li><a class="dropdown-item" href="javascript:applyFilter('image', 'grayscale')">Grayscale</a></li>
                                <li><a class="dropdown-item" href="javascript:applyFilter('image', 'bw')">Xerox High-Contrast B&W</a></li>
                            </ul>
                        </div>
                    </div>

                    <div class="ribbon-divider"></div>

                    <div class="ribbon-group ms-auto">
                        <button class="btn btn-undo" id="btnUndo-image" onclick="undoAction('image')" title="Undo last step">
                            <i class="fa-solid fa-rotate-left me-1"></i> Undo
                        </button>
                        <button class="btn btn-redo" id="btnRedo-image" onclick="redoAction('image')" title="Redo next step">
                            <i class="fa-solid fa-rotate-right me-1"></i> Redo
                        </button>
                        <button class="btn btn-reset" onclick="resetImage('image')">
                            <i class="fa-regular fa-trash-can me-1"></i> Reset
                        </button>
                    </div>
                </div>

                <!-- Canvas Workspace Box -->
                <div class="canvas-workspace active-target" id="canvas-container-main" tabindex="0">
                    <span class="zone-badge"><i class="fa-solid fa-paste me-1"></i> Document (Ctrl+V)</span>
                    <input type="file" id="uploadImage" class="d-none" accept="image/*" onchange="loadImage(event, 'image')">
                    <label for="uploadImage" class="drop-zone-placeholder">
                        <div class="drop-icon-ring"><i class="fa-solid fa-cloud-arrow-up"></i></div>
                        <h6>Click to Browse, Drop Image, or Paste from Clipboard</h6>
                        <p class="text-muted">High-resolution standard & custom prints</p>
                    </label>
                    <div class="image-stage-wrap">
                        <img id="image" class="stage-img" alt="Uploaded Document">
                    </div>
                </div>
            </div>
        </section>

        <!-- ================= ID COPY MODE ================= -->
        <section id="idCopySection" class="workspace-view d-none">
            <div class="id-banner mb-3 d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <i class="fa-solid fa-id-card text-primary fs-5 me-2"></i>
                    <span class="fw-bold">scale</span>
                    <div id="idScaleControl" class="d-flex align-items-center gap-2">
                    <label for="cardScaleRange" class="scale-label">Card Size: <strong id="scaleValLabel">80%</strong></label>
                    <input type="range" class="form-range custom-slider" id="cardScaleRange" min="30" max="80" value="80" oninput="updateCardScale(this.value)">
                </div>
                </div>
                
            </div>

            <div class="row g-4">
                <!-- Front Card -->
                <div class="col-12 col-lg-6">
                    <div class="workspace-card h-100">
                        <div class="card-header-bar">
                            <span class="card-label"><i class="fa-regular fa-id-badge me-2 text-primary"></i>Front Side</span>
                            <div class="d-flex gap-1 flex-wrap">
                                <button class="btn btn-sm btn-crop" id="btnCrop-imageFront" onclick="toggleCrop('imageFront')">
                                    <i class="fa-solid fa-crop-simple"></i> Crop
                                </button>
                                <button class="btn btn-sm btn-rotate" onclick="rotateImage('imageFront')">
                                    <i class="fa-solid fa-rotate-right"></i> Rotate
                                </button>
                                <div class="dropdown">
                                    <button class="btn btn-sm btn-filter dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                                        Filter
                                    </button>
                                    <ul class="dropdown-menu shadow-sm">
                                        <li><a class="dropdown-item" href="javascript:applyFilter('imageFront', 'none')">Original</a></li>
                                        <li><a class="dropdown-item" href="javascript:applyFilter('imageFront', 'grayscale')">Grayscale</a></li>
                                        <li><a class="dropdown-item" href="javascript:applyFilter('imageFront', 'bw')">Xerox B&W</a></li>
                                    </ul>
                                </div>
                                <button class="btn btn-sm btn-undo" id="btnUndo-imageFront" onclick="undoAction('imageFront')" title="Undo">
                                    <i class="fa-solid fa-rotate-left"></i> Undo
                                </button>
                                <button class="btn btn-sm btn-redo" id="btnRedo-imageFront" onclick="redoAction('imageFront')" title="Redo">
                                    <i class="fa-solid fa-rotate-right"></i> Redo
                                </button>
                                <button class="btn btn-sm btn-reset" onclick="resetImage('imageFront')">
                                    <i class="fa-regular fa-trash-can"></i> Reset
                                </button>
                            </div>
                        </div>

                        <div class="ratio-strip">
                            <span>Ratio:</span>
                            <button class="badge-ratio active" onclick="setRatio('imageFront', NaN, this)">Free</button>
                            <button class="badge-ratio" onclick="setRatio('imageFront', 85.6/53.98, this)">85:54 (ID)</button>
                            <button class="badge-ratio" onclick="setRatio('imageFront', 1, this)">1:1</button>
                        </div>

                        <div class="canvas-workspace id-box" id="canvas-container-front" tabindex="0">
                            <span class="zone-badge"><i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Front</span>
                            <input type="file" id="uploadImageFront" class="d-none" accept="image/*" onchange="loadImage(event, 'imageFront')">
                            <label for="uploadImageFront" class="drop-zone-placeholder">
                                <div class="drop-icon-ring"><i class="fa-regular fa-id-card"></i></div>
                                <h6>Select or Paste Front Side</h6>
                                <p class="text-muted">Click this box and press Ctrl+V</p>
                            </label>
                            <div class="image-stage-wrap">
                                <img id="imageFront" class="stage-img" alt="ID Front Side">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Back Card -->
                <div class="col-12 col-lg-6">
                    <div class="workspace-card h-100">
                        <div class="card-header-bar">
                            <span class="card-label"><i class="fa-regular fa-id-badge me-2 text-primary"></i>Back Side</span>
                            <div class="d-flex gap-1 flex-wrap">
                                <button class="btn btn-sm btn-crop" id="btnCrop-imageBack" onclick="toggleCrop('imageBack')">
                                    <i class="fa-solid fa-crop-simple"></i> Crop
                                </button>
                                <button class="btn btn-sm btn-rotate" onclick="rotateImage('imageBack')">
                                    <i class="fa-solid fa-rotate-right"></i> Rotate
                                </button>
                                <div class="dropdown">
                                    <button class="btn btn-sm btn-filter dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                                        Filter
                                    </button>
                                    <ul class="dropdown-menu shadow-sm">
                                        <li><a class="dropdown-item" href="javascript:applyFilter('imageBack', 'none')">Original</a></li>
                                        <li><a class="dropdown-item" href="javascript:applyFilter('imageBack', 'grayscale')">Grayscale</a></li>
                                        <li><a class="dropdown-item" href="javascript:applyFilter('imageBack', 'bw')">Xerox B&W</a></li>
                                    </ul>
                                </div>
                                <button class="btn btn-sm btn-undo" id="btnUndo-imageBack" onclick="undoAction('imageBack')" title="Undo">
                                    <i class="fa-solid fa-rotate-left"></i>  Undo
                                </button>
                                <button class="btn btn-sm btn-redo" id="btnRedo-imageBack" onclick="redoAction('imageBack')" title="Redo">
                                    <i class="fa-solid fa-rotate-right"></i> Redo
                                </button>
                                <button class="btn btn-sm btn-reset" onclick="resetImage('imageBack')">
                                    <i class="fa-regular fa-trash-can"></i> Reset
                                </button>
                            </div>
                        </div>

                        <div class="ratio-strip">
                            <span>Ratio:</span>
                            <button class="badge-ratio active" onclick="setRatio('imageBack', NaN, this)">Free</button>
                            <button class="badge-ratio" onclick="setRatio('imageBack', 85.6/53.98, this)">85:54 (ID)</button>
                            <button class="badge-ratio" onclick="setRatio('imageBack', 1, this)">1:1</button>
                        </div>

                        <div class="canvas-workspace id-box" id="canvas-container-back" tabindex="0">
                            <span class="zone-badge"><i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Back</span>
                            <input type="file" id="uploadImageBack" class="d-none" accept="image/*" onchange="loadImage(event, 'imageBack')">
                            <label for="uploadImageBack" class="drop-zone-placeholder">
                                <div class="drop-icon-ring"><i class="fa-regular fa-id-card"></i></div>
                                <h6>Select or Paste Back Side</h6>
                                <p class="text-muted">Click this box and press Ctrl+V</p>
                            </label>
                            <div class="image-stage-wrap">
                                <img id="imageBack" class="stage-img" alt="ID Back Side">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Framework & Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    <!-- App Logic -->
    <script src="js/print.js"></script>
</body>
</html>
