<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split PDF — PDF Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../assets/css/pdf-studio.css" rel="stylesheet">
  <link href="../../assets/css/pdf-components.css" rel="stylesheet">
  <link href="../../assets/css/pdf-responsive.css" rel="stylesheet">
</head>
<body>
  <header id="appHeader"></header>

  <main class="container-fluid py-4 px-3 px-lg-4 flex-grow-1">
    <div id="appBreadcrumbs" class="mb-3"></div>
    <div class="row g-4">
      <aside class="col-12 col-lg-3 col-xl-2" id="appSidebar"></aside>

      <section class="col-12 col-lg-9 col-xl-10">
        <div class="ps-workspace-card p-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <div>
              <h1 class="h4 fw-bold mb-1">Split PDF</h1>
              <p class="small text-secondary mb-0">Preview pages and split by custom ranges, fixed groups, or single pages.</p>
            </div>
            <span id="expectedOutputCountBadge" class="badge bg-primary fs-6">0 Output PDFs</span>
          </div>

          <div id="errorPanel" class="d-none"></div>
          <div id="progressPanel" class="d-none"></div>
          <div id="resultPanel" class="d-none"></div>

          <div id="splitDropzone" class="ps-dropzone" tabindex="0" role="button" aria-label="Select or drop a PDF file to split">
            <i class="bi bi-arrows-angle-expand fs-1 text-primary d-block mb-2" aria-hidden="true"></i>
            <div class="h5 fw-bold">Select or Drop a PDF to Split</div>
            <span class="btn btn-primary mt-2"><i class="bi bi-scissors me-2"></i>Choose PDF</span>
            <input type="file" id="splitFileInput" class="d-none" accept=".pdf,application/pdf">
          </div>

          <div id="splitWorkspace" class="d-none">
            <div class="p-3 bg-body-tertiary rounded-3 border mb-3 d-flex justify-content-between align-items-center">
              <span class="fw-semibold small" id="splitFileSummary"></span>
              <button type="button" class="btn btn-sm btn-outline-secondary" onclick="location.reload()">Change File</button>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-12 col-md-4">
                <label for="splitModeSelect" class="form-label fw-semibold small">Split Mode</label>
                <select id="splitModeSelect" class="form-select">
                  <option value="ranges">Custom / Multiple Page Ranges (Separate PDFs)</option>
                  <option value="single-merged">Selected Pages into One Single PDF</option>
                  <option value="fixed">Fixed-Size Page Groups (Every N Pages)</option>
                  <option value="every">Every Page into an Individual PDF</option>
                </select>
              </div>

              <div class="col-12 col-md-5" id="rangeInputWrap">
                <label for="splitRangeInput" class="form-label fw-semibold small">Page Ranges (e.g., 1-3, 7, 9-12)</label>
                <input type="text" id="splitRangeInput" class="form-control" placeholder="1-3, 5, 7-10">
                <div class="form-check mt-1">
                  <input class="form-check-input" type="checkbox" id="allowOverlapCheck" checked>
                  <label class="form-check-label small text-secondary" for="allowOverlapCheck">
                    Allow overlapping ranges
                  </label>
                </div>
              </div>

              <div class="col-12 col-md-5 d-none" id="groupSizeWrap">
                <label for="splitGroupSizeInput" class="form-label fw-semibold small">Pages Per Group (N)</label>
                <input type="number" id="splitGroupSizeInput" class="form-control" min="1" value="5">
              </div>

              <div class="col-12 col-md-3 d-flex align-items-end">
                <button type="button" class="btn btn-primary w-100 fw-semibold" id="executeSplitBtn">
                  <i class="bi bi-scissors me-1"></i>Split &amp; Download
                </button>
              </div>
            </div>

            <h2 class="h6 fw-bold text-secondary mb-2">Expected Output Split Groups (with Page Previews)</h2>
            <div class="row g-3 mb-4" id="splitGroupsPreview"></div>

            <h2 class="h6 fw-bold text-secondary mb-2">All Document Pages Preview (Click any page to add to range)</h2>
            <div id="splitAllPagesGrid" class="ps-thumb-grid"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="appFooter"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="../../assets/js/tools/split.js"></script>
</body>
</html>
