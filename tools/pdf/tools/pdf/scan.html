<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan to PDF — PDF Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../assets/css/pdf-studio.css" rel="stylesheet">
  <link href="../../assets/css/pdf-components.css" rel="stylesheet">
  <link href="../../assets/css/pdf-responsive.css" rel="stylesheet">
</head>
<body>
  <header id="appHeader"></header>

  <main class="container-fluid py-4 px-3 px-lg-4 flex-grow-1">
    <div id="appBreadcrumbs" class="mb-3"></div>
    <div class="row g-4">
      <aside class="col-12 col-lg-3 col-xl-2" id="appSidebar"></aside>

      <section class="col-12 col-lg-9 col-xl-10">
        <div class="ps-workspace-card p-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <div>
              <h1 class="h4 fw-bold mb-1">Scan to PDF</h1>
              <p class="small text-secondary mb-0">Capture from camera or import images, crop individual pages, and monitor live output file sizes.</p>
            </div>
            <div class="d-flex gap-2">
              <span id="scanCountBadge" class="badge bg-primary fs-6">0 Pages</span>
              <span id="scanLiveTotalSizeBadge" class="badge bg-info text-dark fs-6">Est. Size: 0 B</span>
            </div>
          </div>

          <div id="errorPanel" class="d-none"></div>
          <div id="progressPanel" class="d-none"></div>
          <div id="resultPanel" class="d-none"></div>

          <div class="row g-3 mb-3">
            <div class="col-12 col-md-8">
              <div id="scanDropzone" class="ps-dropzone h-100 d-flex flex-column justify-content-center" tabindex="0" role="button" aria-label="Import scanned images from device">
                <i class="bi bi-file-earmark-plus fs-1 text-primary mb-2" aria-hidden="true"></i>
                <div class="h5 fw-bold">Import Scanned Images</div>
                <p class="small text-secondary mb-0">JPG, PNG, WebP</p>
                <input type="file" id="scanFileInput" class="d-none" multiple accept="image/jpeg,image/png,image/webp">
              </div>
            </div>
            <div class="col-12 col-md-4">
              <div class="p-4 border rounded-3 h-100 d-flex flex-column justify-content-center align-items-center text-center bg-body-tertiary">
                <i class="bi bi-camera-video-fill fs-1 text-primary mb-2" aria-hidden="true"></i>
                <h2 class="h6 fw-bold">Camera Capture</h2>
                <button type="button" class="btn btn-outline-primary w-100 mt-2" id="startCameraBtn">
                  <i class="bi bi-camera me-1"></i>Open Camera
                </button>
              </div>
            </div>
          </div>

          <div id="cameraCapturePanel" class="d-none card border-primary mb-4">
            <div class="card-body text-center">
              <video id="cameraVideo" autoplay playsinline class="w-100 rounded bg-dark mb-3" style="max-height: 360px; object-fit: contain;"></video>
              <div class="d-flex justify-content-center gap-2">
                <button type="button" class="btn btn-primary fw-semibold" id="captureFrameBtn"><i class="bi bi-record-circle me-1"></i>Capture Page</button>
                <button type="button" class="btn btn-outline-secondary" id="stopCameraBtn">Close Camera</button>
              </div>
            </div>
          </div>

          <div id="scanWorkspace" class="d-none">
            <div class="row g-3 p-3 bg-body-tertiary rounded-3 border mb-3">
              <div class="col-6 col-md-2">
                <label for="scanColorMode" class="form-label small fw-semibold">Filter Mode</label>
                <select id="scanColorMode" class="form-select form-select-sm">
                  <option value="color">Original Color</option>
                  <option value="grayscale">Grayscale</option>
                  <option value="bw">High-Contrast B&amp;W</option>
                </select>
              </div>
              <div class="col-6 col-md-2">
                <label for="scanBrightness" class="form-label small fw-semibold">Brightness</label>
                <input type="range" id="scanBrightness" class="form-range" min="-60" max="60" value="0">
              </div>
              <div class="col-6 col-md-2">
                <label for="scanContrast" class="form-label small fw-semibold">Contrast</label>
                <input type="range" id="scanContrast" class="form-range" min="-60" max="80" value="10">
              </div>
              <div class="col-6 col-md-2">
                <label for="scanPageSize" class="form-label small fw-semibold">Page Size</label>
                <select id="scanPageSize" class="form-select form-select-sm">
                  <option value="A4">A4</option>
                  <option value="Letter">Letter</option>
                  <option value="Original">Original Size</option>
                </select>
              </div>
              <div class="col-6 col-md-2">
                <label for="scanOrientation" class="form-label small fw-semibold">Orientation</label>
                <select id="scanOrientation" class="form-select form-select-sm">
                  <option value="portrait">Portrait</option>
                  <option value="landscape">Landscape</option>
                </select>
              </div>
              <div class="col-6 col-md-2">
                <label for="scanQuality" class="form-label small fw-semibold">Compression Quality</label>
                <select id="scanQuality" class="form-select form-select-sm">
                  <option value="0.92">High (92%)</option>
                  <option value="0.80" selected>Balanced (80%)</option>
                  <option value="0.60">Compact (60%)</option>
                </select>
              </div>
              <div class="col-6 col-md-2">
                <label for="scanPageMargin" class="form-label small fw-semibold">Margin (pt)</label>
                <input type="number" id="scanPageMargin" class="form-control form-control-sm" min="0" max="72" value="18">
              </div>
              <div class="col-12 col-md-10 d-flex flex-wrap align-items-end justify-content-end gap-2">
                <input type="text" id="scanOutputFilename" class="form-control form-control-sm" style="max-width:190px;" value="scanned-document" aria-label="Output filename">
                <button type="button" class="btn btn-primary fw-semibold" id="generateScanPdfBtn">
                  <i class="bi bi-file-earmark-check me-1"></i>Generate Scanned PDF
                </button>
              </div>
            </div>

            <div id="scanPagesGrid" class="ps-thumb-grid" role="list" aria-label="Scanned Pages"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="appFooter"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script type="module" src="../../assets/js/tools/scan.js"></script>
</body>
</html>
