<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merge PDF — PDF Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/pdf-studio.css" rel="stylesheet">
  <link href="../css/pdf-components.css" rel="stylesheet">
  <link href="../css/pdf-responsive.css" rel="stylesheet">
</head>
<body>
  <header id="appHeader"></header>

  <main class="container-fluid py-4 px-3 px-lg-4 flex-grow-1">
    <div id="appBreadcrumbs" class="mb-3"></div>
    <div class="row g-4">
      <aside class="col-12 col-lg-3 col-xl-2" id="appSidebar"></aside>

      <section class="col-12 col-lg-9 col-xl-10">
        <div class="ps-workspace-card p-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <div>
              <h1 class="h4 fw-bold mb-1">Merge PDF</h1>
              <p class="small text-secondary mb-0">Combine two or more PDF files in your desired order. Mixed page sizes and orientations are preserved.</p>
            </div>
            <span id="mergeSummaryBadge" class="badge bg-primary fs-6">0 Files</span>
          </div>

          <div id="errorPanel" class="d-none"></div>
          <div id="progressPanel" class="d-none"></div>
          <div id="resultPanel" class="d-none"></div>

          <div id="mergeDropzone" class="ps-dropzone mb-3" tabindex="0" role="button" aria-label="Select or drop two or more PDF files to merge">
            <i class="bi bi-arrows-angle-contract fs-1 text-primary d-block mb-2" aria-hidden="true"></i>
            <div class="h5 fw-bold">Drop 2 or More PDFs Here</div>
            <p class="small text-secondary mb-3">You can add more files and reorder them before merging</p>
            <span class="btn btn-primary"><i class="bi bi-plus-circle me-2"></i>Select PDF Files</span>
            <input type="file" id="mergeFileInput" class="d-none" multiple accept=".pdf,application/pdf">
            <input type="file" id="mergeReplaceInput" class="d-none" accept=".pdf,application/pdf">
          </div>

          <div id="mergeWorkspace" class="d-none">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
              <div class="d-flex gap-2">
                <button type="button" class="btn btn-sm btn-outline-primary" id="addMorePdfsBtn"><i class="bi bi-plus-lg me-1"></i>Add More PDFs</button>
                <button type="button" class="btn btn-sm btn-outline-danger" id="clearMergeQueueBtn">Clear All</button>
              </div>
              <div class="d-flex align-items-center gap-2">
                <label for="mergeOutputFilename" class="small fw-semibold text-nowrap mb-0">Output Filename:</label>
                <input type="text" id="mergeOutputFilename" class="form-control form-control-sm" style="max-width:200px;" value="merged-document">
                <button type="button" class="btn btn-primary fw-semibold" id="mergeActionBtn" disabled>
                  <i class="bi bi-intersect me-1"></i>Merge PDFs
                </button>
              </div>
            </div>

            <div id="mergeQueueList" role="list" aria-label="Files queued for merging"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="appFooter"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <script type="module" src="../js/tools/merge.js"></script>
</body>
</html>
