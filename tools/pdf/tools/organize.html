<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organize PDF — PDF Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/pdf-studio.css" rel="stylesheet">
  <link href="../css/pdf-components.css" rel="stylesheet">
  <link href="../css/pdf-responsive.css" rel="stylesheet">
</head>
<body>
  <header id="appHeader"></header>

  <main class="container-fluid py-4 px-3 px-lg-4 flex-grow-1">
    <div id="appBreadcrumbs" class="mb-3"></div>
    <div class="row g-4">
      <aside class="col-12 col-lg-3 col-xl-2" id="appSidebar"></aside>

      <section class="col-12 col-lg-9 col-xl-10">
        <div class="ps-workspace-card p-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <div>
              <h1 class="h4 fw-bold mb-1">Organize PDF</h1>
              <p class="small text-secondary mb-0">Reorder, rotate, crop, copy to clipboard, duplicate, extract, or delete pages.</p>
            </div>
            <span id="totalPagesBadge" class="badge bg-primary fs-6">0 Pages</span>
          </div>

          <div id="errorPanel" class="d-none"></div>
          <div id="progressPanel" class="d-none"></div>
          <div id="resultPanel" class="d-none"></div>

          <div id="organizeDropzone" class="ps-dropzone" tabindex="0" role="button" aria-label="Select or drop a PDF file to organize">
            <i class="bi bi-grid-3x3-gap-fill fs-1 text-primary d-block mb-2" aria-hidden="true"></i>
            <div class="h5 fw-bold">Select or Drop a PDF File</div>
            <span class="btn btn-primary mt-2"><i class="bi bi-folder2-open me-2"></i>Choose PDF</span>
            <input type="file" id="organizeFileInput" class="d-none" accept=".pdf,application/pdf">
          </div>

          <div id="organizeWorkspace" class="d-none">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 p-3 bg-body-tertiary rounded-3 mb-3 border">
              <div class="small fw-semibold" id="fileSummaryText"></div>
              <div class="d-flex flex-wrap align-items-center gap-2">
                <span class="badge bg-secondary" id="selectionCountBadge">0 selected</span>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="selectAllBtn">Select All</button>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="deselectAllBtn">Deselect All</button>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="undoBtn" disabled><i class="bi bi-arrow-counterclockwise"></i> Undo</button>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="redoBtn" disabled><i class="bi bi-arrow-clockwise"></i> Redo</button>
                <button type="button" class="btn btn-sm btn-outline-warning" id="resetArrangementBtn">Reset</button>
                <div class="btn-group btn-group-sm" role="group" aria-label="Thumbnail Zoom">
                  <button type="button" class="btn btn-outline-secondary" id="zoomOutBtn" aria-label="Zoom out"><i class="bi bi-zoom-out"></i></button>
                  <button type="button" class="btn btn-outline-secondary" id="zoomInBtn" aria-label="Zoom in"><i class="bi bi-zoom-in"></i></button>
                </div>
              </div>
            </div>

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
              <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-sm btn-outline-secondary" id="copySelectedBtn" disabled><i class="bi bi-clipboard me-1"></i>Copy Page Image</button>
                <button type="button" class="btn btn-sm btn-outline-primary" id="duplicateSelectedBtn" disabled><i class="bi bi-copy me-1"></i>Duplicate</button>
                <button type="button" class="btn btn-sm btn-outline-info" id="extractSelectedBtn" disabled><i class="bi bi-box-arrow-up-right me-1"></i>Extract to PDF</button>
                <button type="button" class="btn btn-sm btn-outline-danger" id="deleteSelectedBtn" disabled><i class="bi bi-trash me-1"></i>Delete</button>
              </div>
              <div class="d-flex align-items-center gap-2">
                <label for="outputFilename" class="small fw-semibold text-nowrap mb-0">Output:</label>
                <input type="text" id="outputFilename" class="form-control form-control-sm" style="max-width:190px;" value="organized">
                <button type="button" class="btn btn-primary fw-semibold text-nowrap" id="saveOrganizedBtn">
                  <i class="bi bi-check2-circle me-1"></i>Save PDF
                </button>
              </div>
            </div>

            <div id="organizeThumbGrid" class="ps-thumb-grid" role="list" aria-label="PDF Page Thumbnails"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="appFooter"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <script type="module" src="../js/tools/organize.js"></script>
</body>
</html>
