<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="../../images/png logo.png">
  <title>PDF Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/pdf-studio.css" rel="stylesheet">
  <link href="css/pdf-components.css" rel="stylesheet">
  <link href="css/pdf-responsive.css" rel="stylesheet">
</head>
<body>
  <header id="appHeader"></header>

  <main class="container-fluid py-4 px-3 px-lg-4 flex-grow-1">
    <div id="appBreadcrumbs" class="mb-3"></div>
    <div class="row g-4">
      <aside class="col-12 col-lg-3 col-xl-2" id="appSidebar"></aside>

      <section class="col-12 col-lg-9 col-xl-10">
        <div class="ps-workspace-card p-4 mb-4">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
              <h1 class="h3 fw-bold mb-1">PDF Studio</h1>
              <p class="text-secondary mb-0">Select a tool or drop your files below.</p>
            </div>
            <div class="small text-secondary">
              <strong>Supported:</strong> PDF, JPG, PNG, WebP
            </div>
          </div>

          <div id="recentToolsSection" class="d-none"></div>

          <div id="dashboardQuickDrop" class="ps-dropzone mb-4" tabindex="0" role="button" aria-label="Drop PDF or image files here">
            <i class="bi bi-cloud-arrow-up-fill fs-1 text-primary d-block mb-2" aria-hidden="true"></i>
            <div class="h5 fw-bold mb-1">Drop a PDF or Image here</div>
            <p class="small text-secondary mb-0">Or choose any tool below</p>
            <input type="file" id="dashboardQuickInput" class="d-none" multiple accept=".pdf,image/jpeg,image/png,image/webp">
          </div>

          <div class="row g-3" id="dashboardToolsGrid"></div>
        </div>
      </section>
    </div>
  </main>

  <div class="modal fade" id="quickRouteModal" tabindex="-1" aria-labelledby="quickRouteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="quickRouteModalLabel">Choose Tool</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="quickRouteModalBody"></div>
      </div>
    </div>
  </div>

  <div id="appFooter"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initDashboardPage } from './js/pdf-app.js';
    initDashboardPage();
  </script>
</body>
</html>
