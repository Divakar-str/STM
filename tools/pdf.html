<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> PDF Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="../images/png logo.png">
  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/pdf.css">

  <!-- Core Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

  <div class="container-fluid py-2 py-md-4 px-2 px-md-4 px-lg-5 main-shell">
    <div class="row g-3 g-md-4">
      
      <!-- Responsive Navigation: Desktop Sidebar / Mobile Swipeable Rail -->
      <aside class="col-12 col-md-4 col-lg-3">
        <div class="sidebar-panel">
          <div class="sidebar-heading d-none d-md-block"> PDF Tools</div>
          <div class="tool-list-container">
            <ul class="tool-list">
              <li>
                <button class="tool-btn active" data-tool="organize">
                  <div class="tool-icon organize"><i class="bi bi-grid-fill"></i></div>
                  <div class="tool-meta">
                    <span class="tool-name">Organize PDF</span>
                    <small class="tool-desc d-none d-md-block">Sort, rotate & delete</small>
                  </div>
                </button>
              </li>
              <li>
                <button class="tool-btn" data-tool="merge">
                  <div class="tool-icon merge"><i class="bi bi-arrows-angle-contract"></i></div>
                  <div class="tool-meta">
                    <span class="tool-name">Merge PDF</span>
                    <small class="tool-desc d-none d-md-block">Combine multiple files</small>
                  </div>
                </button>
              </li>
              <li>
                <button class="tool-btn" data-tool="split">
                  <div class="tool-icon split"><i class="bi bi-arrows-angle-expand"></i></div>
                  <div class="tool-meta">
                    <span class="tool-name">Split PDF</span>
                    <small class="tool-desc d-none d-md-block">Extract custom ranges</small>
                  </div>
                </button>
              </li>
              <li>
                <button class="tool-btn" data-tool="remove">
                  <div class="tool-icon remove"><i class="bi bi-x-lg"></i></div>
                  <div class="tool-meta">
                    <span class="tool-name">Remove pages</span>
                    <small class="tool-desc d-none d-md-block">Delete unwanted pages</small>
                  </div>
                </button>
              </li>
              <li>
                <button class="tool-btn" data-tool="extract">
                  <div class="tool-icon extract"><i class="bi bi-box-arrow-up-right"></i></div>
                  <div class="tool-meta">
                    <span class="tool-name">Extract pages</span>
                    <small class="tool-desc d-none d-md-block">Select pages to save</small>
                  </div>
                </button>
              </li>
              <li>
                <button class="tool-btn" data-tool="scan">
                  <div class="tool-icon scan"><i class="bi bi-camera-viewfinder"></i></div>
                  <div class="tool-meta">
                    <span class="tool-name">Scan to PDF</span>
                    <small class="tool-desc d-none d-md-block">Upload or capture images</small>
                  </div>
                </button>
              </li>
              <li>
                <button class="tool-btn" data-tool="convert">
                  <div class="tool-icon convert"><i class="bi bi-images"></i></div>
                  <div class="tool-meta">
                    <span class="tool-name">PDF to Image</span>
                    <small class="tool-desc d-none d-md-block">Lossless PNG / JPEG</small>
                  </div>
                </button>
              </li>
            </ul>
          </div>
        </div>
      </aside>

      <!-- Main Workspace -->
      <main class="col-12 col-md-8 col-lg-9">
        <div class="studio-card">
          
          <header class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3 mb-md-4">
            <div>
              <h4 class="fw-bold mb-1 fs-5 fs-md-4" id="workspaceHeading">Organize PDF</h4>
              <p class="text-muted small mb-0 d-none d-sm-block" id="workspaceSubheading">Drag cards or tap move buttons to sort, rotate, and delete pages.</p>
            </div>
            <button id="resetBtn" class="btn btn-outline-secondary btn-sm rounded-pill px-3 py-1 d-none">
              <i class="bi bi-arrow-counterclockwise me-1"></i> <span class="d-none d-sm-inline">Clear</span>
            </button>
          </header>

          <!-- File Upload Drop Zone -->
          <div id="dropZone" class="drop-zone mb-3 mb-md-4">
            <div class="drop-badge mb-2">
              <i class="bi bi-file-earmark-pdf-fill" id="dropIcon"></i>
            </div>
            <h5 class="fw-bold mb-1 fs-6 fs-md-5" id="dropTitle">Tap or Drag PDF here</h5>
            <p class="text-muted small mb-0" id="dropSubtitle">In-browser processing • No uploads to external servers</p>
            <input type="file" id="pdfFileInput" accept="application/pdf" hidden>
          </div>

          <!-- SCAN TO PDF DUAL MODE (Upload First, Mobile Ready) -->
          <div id="scannerSection" class="scanner-container d-none mb-4">
            <ul class="nav nav-pills justify-content-center mb-3 gap-2" id="scanModeTabs">
              <li class="nav-item">
                <button class="nav-link active rounded-pill px-3 py-2 text-white small" id="tabUploadMode">
                  <i class="bi bi-upload me-1"></i> Upload Photos
                </button>
              </li>
              <li class="nav-item">
                <button class="nav-link rounded-pill px-3 py-2 text-white small" id="tabCameraMode">
                  <i class="bi bi-camera me-1"></i> Camera
                </button>
              </li>
            </ul>

            <!-- Priority 1: Gallery / Image File Upload -->
            <div id="imageUploadBox">
              <div id="imageDropZone" class="drop-zone border-secondary text-white bg-dark mb-3 p-4">
                <div class="drop-badge text-white mb-2"><i class="bi bi-images"></i></div>
                <h6 class="fw-bold mb-1">Select Images from Gallery / Device</h6>
                <small class="text-light opacity-75">Tap or drag images here (JPG, PNG, WebP)</small>
                <input type="file" id="imageFileInput" accept="image/*" multiple hidden>
              </div>
            </div>

            <!-- Priority 2: Live Camera Viewfinder -->
            <div id="cameraBox" class="d-none">
              <div class="video-preview-wrapper mb-3">
                <video id="cameraVideo" autoplay playsinline muted></video>
                <canvas id="cameraCaptureCanvas" class="d-none"></canvas>
              </div>
              <div class="text-center">
                <button id="snapBtn" class="btn btn-danger btn-lg px-4 rounded-pill fw-semibold shadow">
                  <i class="bi bi-camera-fill me-1"></i> Capture
                </button>
              </div>
            </div>

            <!-- Mobile Scanned Items Horizontal Scroll -->
            <div class="mt-3 border-top border-secondary pt-3">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="small text-light">Staged Pages: <strong id="scanCount">0</strong></span>
                <button id="finishScanBtn" class="btn btn-success btn-sm rounded-pill px-3 fw-semibold" disabled>
                  <i class="bi bi-file-earmark-pdf me-1"></i> Compile PDF
                </button>
              </div>
              <div id="scannedPagesRow" class="d-flex gap-2 overflow-auto py-2 mobile-kinetic-scroll"></div>
            </div>
          </div>

          <!-- Dynamic Action / Controls Bar -->
          <div id="controlsBar" class="controls-deck mb-3 mb-md-4 d-none">
            <div class="row g-2 g-md-3 align-items-center" id="controlsContent"></div>
          </div>

          <!-- Loading Spinner -->
          <div id="loadingStatus" class="text-center my-4 d-none">
            <div class="spinner-border text-danger spinner-border-sm" role="status"></div>
            <span id="loadingText" class="ms-2 small text-muted fw-semibold">Processing...</span>
          </div>

          <!-- Active Workspace Output Container -->
          <div id="viewContainer"></div>

        </div>
      </main>

    </div>
  </div>

  <script src="js/pdf.js"></script>
</body>
</html>
